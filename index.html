<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Perry's Pages</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
  </head>
  <body>
    <main>
      <div id="header">
        <div id="logo">
        <img id="perry" src="Perry's Pages.png" alt="perry the dragon">
      </div>


        <div class="content" id="checkout"> 
          <h3>Create New Checkout</h3>

          <div class="submissions">
        
          <div class="copies">
            <label># Copies:</label>
            <div class="check-btn">
              <button id="decreasein">-</button>
              <p id="checkin-num">0</p>
              <button id="increasein">+</button>
            </div>
          </div> 
          
          <div class="sets">
            <label for="set">Select Set Materials:</label>
            <input type="text" id="set" name="set" placeholder="Enter book title...">
            <ul id="suggestions"></ul>
          </div>

          <div class="class">
            <label for="classroom">Classroom Checking In/Out:</label>
            <input type="text" id="classroom" name="classroom" placeholder="Enter the class name...">
          </div>
        </div>

          <button id="processcheck">Process</button>          
        </div>

      </div>

      <div id="mainbdy"> 

        <div id="left">

          <div class="content" id="checks"> 
            <h3>Manage Material Checkout</h3>  
            <div id="toolbarcheck"> 
              <div class="filterbox">
              <label for="filtercheck">Filter by Classroom</label>
              <input id="filtercheck" class="input" type="text" placeholder="Filter by Classroom">
              </div>
            </div>
          </div>
</div>

        <div class="content" id="curr"> 
          <h3>Manage Curriculum Records</h3>
          <div id="toolbar"> 
            <div class="filterbox">
              <label for="filtermat">Filter by Materials</label>
              <input id="filtermat" class="input" type="text" placeholder="Filter by Materials">
            </div>
           

          </div>
        </div>
     
      
      </div>
    </main>
  </div>

  <div id="myModal" class="modal">
    <button class="close">X</button>

    <div class="modal-content">
    </div>

  </div>

    <script src="index.js"></script>
  </body>
</html>
