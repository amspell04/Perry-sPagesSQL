<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Perry's Pages</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
  </head>
  <body>
    <main>
      <div id="header">
        <h1 id="title">Perry's Pages</h1> 

        <div class="content" id="checkout"> 
          <h3>Create New Checkout</h3>
        

            <div class="copies">
              <p>Number of Copies:</p>
              <div class="check-btn">
                <button id="decreasein">-</button>
                <p id="checkin-num">0</p>
                <button id="increasein">+</button>
              </div>
            </div> 
          
              <label for="set">Select Set Materials:</label>
              <input type="text" id="set" name="set" placeholder="Enter book title...">
              <ul id="suggestions"></ul>


              <label for="classroom">Classroom Checking In/Out:</label>
              <input type="text" id="classroom" name="classroom">

              
              <button id="processcheck">Process</button>          
          </div>

      </div>

      <div id="mainbdy"> 

        <div id="left">

          <div class="content" id="checks"> 
            <h2>Manage Material Checkout</h2>  
          
          </div>
</div>

        <div class="content" id="curr"> 
          <h2>Manage Curriculum Records</h2>
          <div id="toolbar"> 
        
          </div>
        </div>
     
      
      </div>
    </main>
  </div>

    <script src="index.js"></script>
  </body>
</html>
